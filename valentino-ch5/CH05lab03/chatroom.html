    <!-- Voice Command Button -->
    <h2>Accessibility Feature</h2>
    <button onclick="startVoice()">🎤 Start Voice Command</button>
    <p id="voiceOutput"></p>

    <!-- AI Chatbox -->
    <h2>Ask About Books</h2>
    <div id="chatbox">
        <input type="text" id="userInput" placeholder="Ask for book recommendations..." />
        <button onclick="chat()">Ask</button>
        <p id="chatResponse"></p>
    </div>




<script>
    // Simple Voice Recognition
    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.start();

        recognition.onresult = function(event) {
            document.getElementById("voiceOutput").innerText =
                "You said: " + event.results[0][0].transcript;
        };
    }

    // Simple AI Chat Simulation
    function chat() {
        let input = document.getElementById("userInput").value.toLowerCase();
        let response = "";

        if (input.includes("motivation")) {
            response = "Try reading 'Atomic Habits'!";
        } else if (input.includes("dream")) {
            response = "You might like 'The Alchemist'.";
        } else {
            response = "Great question! More recommendations coming soon.";
        }

        document.getElementById("chatResponse").innerText = response;
    }
</script>
